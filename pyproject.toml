[project]
name = "ai-practice"
version = "0.1.0"
description = "TDD-based AI & LangGraph Practice Playground"
readme = "README.md"
authors = [
    { name = "kyungpyokim", email = "kyungpyo.kim0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.3",
    "ruff-lsp>=0.0.62",
    "typing-extensions>=4.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line length handled by formatter
    "UP047", # allow standard TypeVar for IDE / type-checker compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["ai_practice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--cov=ai_practice",
    "--cov-report=term-missing",
    "-v",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests",
    "slow: Tests that might take longer",
]

[tool.coverage.run]
source = ["src/ai_practice"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest_watcher]
now = true
delay = 0.2
runner = "pytest"
patterns = ["*.py"]
ignore_patterns = [".venv/*", ".git/*", ".pytest_cache/*", ".ruff_cache/*"]

